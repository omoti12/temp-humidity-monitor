<!doctype html>
<!--
  ============================================================
  ラズパイ内のサイトの画面（http://ラズパイのIP:8000）
  web/app.py が表示する。{{ step }} の部分は app.py が数字（10）に置き換える

  データの読み先
    ・api/data?day=日付 を1分ごとに読み、現在値とグラフを更新する
  公開サイトの画面（pages/index.html）とほぼ同じ作り
  ============================================================
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- スマホでも見やすい幅で表示する -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>温湿度モニター</title>
<!-- グラフを描く部品（Chart.js）。web/static に置いてある -->
<script src="static/chart.umd.js"></script>
<!-- グラフを拡大・移動する部品（hammer.min.js はスマホの指の操作用。zoom より先に読む） -->
<script src="static/hammer.min.js"></script>
<script src="static/chartjs-plugin-zoom.min.js"></script>
<style>
  /* ---- 色の設定（ここを変えると全体の色が変わる）---- */
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --temp: #d9480f; --hum: #1c7ed6; --ok: #2b8a3e; --warn: #e8590c; --out: #7048e8;
    --hot-warn: #b08800; --cold-warn: #9775fa; --cmp: #0b7285;
  }
  /* スマホやPCがダークモードのときの色 */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --card: #1d2027; --text: #e9ecef; --muted: #9aa1ab; --line: #2c313a;
      --temp: #ff8a5c; --hum: #66b2ff; --ok: #51cf66; --warn: #ff922b; --out: #b197fc;
      --hot-warn: #fcc419; --cold-warn: #d0bfff; --cmp: #66d9e8;
    }
  }
  /* ---- 全体のレイアウト ---- */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans CJK JP", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 1.3rem; margin: 0; }
  /* 設置場所の名前（登録されているときだけ、見出しの横に出す） */
  h1 .place { margin-left: .6em; color: var(--temp); }
  .updated { color: var(--muted); font-size: .85rem; }
  /* ---- 上の3つのカード（現在の温度・湿度・状態）---- */
  .now { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .label { color: var(--muted); font-size: .85rem; }
  .value { font-size: 2.4rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .value small { font-size: 1rem; font-weight: 400; margin-left: 2px; }
  #temp { color: var(--temp); } #hum { color: var(--hum); }
  /* 状態の文字の色（正常=緑、高温注意=黄、高温警報=オレンジ、低温注意=薄紫、低温警報=紫） */
  /* 「高温」「低温」は前の版で記録した状態の名前（警報と同じ色にする） */
  #status.正常 { color: var(--ok); }
  #status.高温注意 { color: var(--hot-warn); } #status.高温警報, #status.高温 { color: var(--warn); }
  #status.低温注意 { color: var(--cold-warn); } #status.低温警報, #status.低温 { color: var(--out); }
  /* 湿度の状態（高湿注意=黄、高湿警報=オレンジ。正常のときは表示しない） */
  .substatus { font-size: .95rem; font-weight: 700; margin-top: 2px; }
  #humStatus.高湿注意 { color: var(--hot-warn); } #humStatus.高湿警報 { color: var(--warn); }
  .stale { color: var(--warn); font-size: .85rem; margin-top: 4px; }
  /* ---- SHT31 と比較用センサー THD-R-C の比べ（THD-R-C を動かしているときだけ出す）---- */
  .compare { margin-bottom: 16px; }
  .compare table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .compare th, .compare td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .compare th:first-child, .compare td:first-child { text-align: left; }
  .compare th { color: var(--muted); font-weight: 400; font-size: .85rem; }
  .compare td { font-size: 1.15rem; font-weight: 600; }
  .compare .cmp { color: var(--cmp); }
  .compare .note { color: var(--muted); font-size: .8rem; margin-top: 6px; }
  /* ---- 日付を選ぶボタンの並び ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .controls button, .controls input, .controls a {
    font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); text-decoration: none; cursor: pointer; }
  /* ---- グラフ ---- */
  .chart-card { margin-bottom: 12px; }
  /* ---- グラフの表示範囲のボタン ---- */
  .zoombar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
  .zoombar button { font: inherit; font-size: .85rem; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line);
                    background: var(--card); color: var(--text); cursor: pointer; }
  .zoombar .hint { color: var(--muted); font-size: .8rem; }
  .chart-box { position: relative; height: 260px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  /* ---- スマホなど画面が狭いとき（幅600px以下）---- */
  @media (max-width: 600px) {
    .now { grid-template-columns: 1fr 1fr; }
    .now .card:last-child { grid-column: span 2; }
    .value { font-size: 1.9rem; }
    .chart-box { height: 220px; }
  }
</style>
</head>
<body>
<main data-step="{{ step }}">
  <!-- 見出しと最終記録の時刻 -->
  <header>
    <h1>温湿度モニター<span class="place" id="place"></span></h1>
    <span class="updated" id="updated"></span>
  </header>

  <!-- 現在の温度・湿度・状態（中身は下の load() が書き込む） -->
  <section class="now">
    <div class="card"><div class="label">現在の温度</div><div class="value" id="temp">--</div></div>
    <div class="card"><div class="label">現在の湿度</div><div class="value" id="hum">--</div>
      <div class="substatus" id="humStatus" hidden></div></div>
    <div class="card"><div class="label">状態</div><div class="value" id="status">--</div>
      <div class="stale" id="stale" hidden>5分以上データが届いていません</div></div>
  </section>

  <!-- SHT31 と比較用センサー THD-R-C の今の値の比べ（THD-R-C を動かしているときだけ出す。中身は showCompare() が書く） -->
  <section class="card compare" id="compare" hidden>
    <div class="label">SHT31 と THD-R-C の比較（今の値）</div>
    <table>
      <tr><th></th><th>SHT31</th><th>THD-R-C</th><th>差</th></tr>
      <tr><td>温度</td><td id="cmpTs">--</td><td class="cmp" id="cmpTc">--</td><td id="cmpTd">--</td></tr>
      <tr><td>湿度</td><td id="cmpHs">--</td><td class="cmp" id="cmpHc">--</td><td id="cmpHd">--</td></tr>
    </table>
    <div class="note">差 = THD-R-C − SHT31。THD-R-C の誤差は 温度 ±1.0℃・湿度 ±3%（説明書の値）</div>
  </section>

  <!-- 表示する日を切り替えるボタンと、CSVのダウンロード -->
  <div class="controls">
    <button id="prev">◀ 前日</button>
    <input type="date" id="day">
    <button id="next">翌日 ▶</button>
    <button id="today">今日</button>
    <a id="dl" href="#">CSVダウンロード</a>
  </div>

  <!-- グラフの表示範囲（拡大）のボタン。温度と湿度のグラフは一緒に動く -->
  <div class="zoombar">
    <span class="label">表示範囲</span>
    <button data-hours="24">全体</button>
    <button data-hours="6">6時間</button>
    <button data-hours="3">3時間</button>
    <button data-hours="1">1時間</button>
    <button data-move="-1">◀ 前へ</button>
    <button data-move="1">次へ ▶</button>
    <span class="hint" id="zoomHint"></span>
  </div>

  <!-- グラフを描く場所 -->
  <div class="card chart-card">
    <div class="label">温度（{{ step }}分ごとの平均、薄い帯は最高〜最低）</div>
    <div class="chart-box"><canvas id="tempChart"></canvas></div>
  </div>
  <div class="card chart-card">
    <div class="label">湿度（{{ step }}分ごとの平均）</div>
    <div class="chart-box"><canvas id="humChart"></canvas></div>
  </div>
  <div class="empty" id="empty" hidden>この日の記録はありません</div>
</main>

<script>
// ============================================================
// 画面を動かすプログラム（JavaScript）
// ============================================================

// よく使う短縮の関数
// $("temp")      … id="temp" の部品を取り出す
// css("--temp")  … 上の :root で決めた色を取り出す
// fmt(日付)      … 日付を "2026-10-19" の形にする
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (d) => d.toLocaleDateString("sv-SE");   // YYYY-MM-DD
// 今表示している日（最初は今日）
let day = fmt(new Date());
let tempChart, humChart;

// 0:00〜23:50 の10分刻みの軸（記録がない時間は空白にする）
const slots = [];
// 間隔（分）は web/app.py が <main data-step="10"> に入れたものを読む
const STEP = Number(document.querySelector("main").dataset.step) || 10;
for (let m = 0; m < 24 * 60; m += STEP)
  slots.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));

// スマホなど指で操作する画面か（拡大のしかたを変える）
const isTouch = window.matchMedia("(pointer: coarse)").matches;

// 横軸の目盛りの間隔（何マスおきに時刻を書くか。1マス = 10分）
// 表示している範囲の広さに合わせて、10分・30分・1時間・2時間・6時間・12時間ごとから選ぶ
function labelStep(count) {
  const maxLabels = window.innerWidth < 600 ? 5 : 12;
  for (const step of [1, 3, 6, 12, 36, 72]) if (count / step <= maxLabels) return step;
  return 72;
}

// グラフ共通の見た目の設定（unit は "℃" か "%"）
function lineOpts(unit) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false, spanGaps: false,
    // グラフにマウスを乗せると、その時刻の値をまとめて表示する
    interaction: { mode: "index", intersect: false },
    // 名前が "_" で始まるデータ（最高・最低の帯）は、凡例と吹き出しに出さない
    plugins: { legend: { labels: { color: css("--muted"), filter: (i) => !i.text.startsWith("_") } },
               tooltip: { filter: (i) => !i.dataset.label.startsWith("_"),
                          callbacks: { label: (c) => `${c.dataset.label}: ${c.parsed.y}${unit}` } },
               // 拡大・移動の設定（横方向＝時刻だけ。温度と湿度のグラフは syncRange で一緒に動かす）
               zoom: {
                 limits: { x: { min: 0, max: slots.length - 1, minRange: 5 } },
                 zoom: { mode: "x",
                         // PC: ドラッグで範囲を選んで拡大、Ctrl＋ホイールで拡大・縮小
                         drag: { enabled: !isTouch, backgroundColor: "rgba(100, 120, 150, 0.15)" },
                         wheel: { enabled: !isTouch, modifierKey: "ctrl" },
                         // スマホ: 2本指で拡大・縮小
                         pinch: { enabled: true },
                         onZoomComplete: ({ chart }) => syncRange(chart) },
                 // 拡大した後の左右の移動（PC は Shift＋ドラッグ、スマホは1本指）
                 pan: { enabled: true, mode: "x", modifierKey: isTouch ? null : "shift",
                        onPanComplete: ({ chart }) => syncRange(chart) },
               } },
    scales: {
      x: { ticks: { color: css("--muted"), maxRotation: 0, autoSkip: false,
                    callback: (v, i, ticks) => v % labelStep(ticks.length) === 0 ? slots[v] : "" },
           grid: { color: (c) => (c.tick && c.tick.value % labelStep(c.chart.scales.x.ticks.length) === 0)
                                   ? css("--line") : "transparent" } },
      y: { ticks: { color: css("--muted"), callback: (v) => v + unit }, grid: { color: css("--line") } },
    },
  };
}

// グラフを2つ作る（最初は空。データは load() で入れる）
function buildCharts() {
  const temp = css("--temp"), hum = css("--hum");
  tempChart = new Chart($("tempChart"), {
    type: "line",
    data: { labels: slots, datasets: [
      // [0] 最高 と [1] 最低：この2本の間を薄く塗って「帯」にする
      { label: "_max", data: [], borderWidth: 0, pointRadius: 0, fill: "+1", backgroundColor: temp + "22" },
      { label: "_min", data: [], borderWidth: 0, pointRadius: 0, fill: false },
      // [2] 温度の平均
      { label: "温度", data: [], borderColor: temp, backgroundColor: temp, pointRadius: 2, borderWidth: 2 },
      // [3]〜[6] 警報（破線）と注意（点線）の基準
      { label: "高温警報", data: [], borderColor: css("--warn"), borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5 },
      { label: "高温注意", data: [], borderColor: css("--hot-warn"), borderDash: [2, 3], pointRadius: 0, borderWidth: 1.5 },
      { label: "低温注意", data: [], borderColor: css("--cold-warn"), borderDash: [2, 3], pointRadius: 0, borderWidth: 1.5 },
      { label: "低温警報", data: [], borderColor: css("--out"), borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5 },
      // [7] 比較用センサー THD-R-C（記録がある日だけ出す）
      { label: "THD-R-C", data: [], borderColor: css("--cmp"), backgroundColor: css("--cmp"), borderDash: [4, 3],
        pointRadius: 1.5, borderWidth: 2, hidden: true },
    ] },
    options: lineOpts("℃"),
  });
  humChart = new Chart($("humChart"), {
    type: "line",
    data: { labels: slots, datasets: [
      { label: "湿度", data: [], borderColor: hum, backgroundColor: hum, pointRadius: 2, borderWidth: 2 },
      // [1] [2] 湿度の警報（破線）と注意（点線）の基準（湿度の警報を使う設定のときだけ線が出る）
      { label: "高湿警報", data: [], borderColor: css("--warn"), borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5 },
      { label: "高湿注意", data: [], borderColor: css("--hot-warn"), borderDash: [2, 3], pointRadius: 0, borderWidth: 1.5 },
      // [3] 比較用センサー THD-R-C（記録がある日だけ出す）
      { label: "THD-R-C", data: [], borderColor: css("--cmp"), backgroundColor: css("--cmp"), borderDash: [4, 3],
        pointRadius: 1.5, borderWidth: 2, hidden: true },
    ] },
    options: lineOpts("%"),
  });
}

// SHT31（s）と比較用センサー THD-R-C（c）の今の値を並べて出す。どちらかがなければ隠す
function showCompare(s, c) {
  $("compare").hidden = !(s && c);
  if (!s || !c) return;
  const val = (x, u) => (x == null ? "--" : `${x.toFixed(1)}${u}`);
  // 差は「THD-R-C − SHT31」。THD-R-C が測れていない（断線など）ときは "--"
  const diff = (a, b, u) => (a == null || b == null ? "--" : `${a - b >= 0 ? "+" : "-"}${Math.abs(a - b).toFixed(1)}${u}`);
  $("cmpTs").textContent = val(s.temp, "℃");
  $("cmpTc").textContent = val(c.temp, "℃");
  $("cmpTd").textContent = diff(c.temp, s.temp, "℃");
  $("cmpHs").textContent = val(s.hum, "%");
  $("cmpHc").textContent = val(c.hum, "%");
  $("cmpHd").textContent = diff(c.hum, s.hum, "%");
}

// グラフに THD-R-C の線を入れる（points は10分ごとの平均。記録がない日は線も凡例も出さない）
// 記録がある日は、SHT31 の線の名前を「SHT31」にして見分けやすくする
function showCompareLines(points) {
  const byTime = Object.fromEntries((points || []).map((p) => [p.time, p]));
  const has = Object.keys(byTime).length > 0;
  const pick = (k) => slots.map((s) => (byTime[s] ? byTime[s][k] : null));
  const t = tempChart.data.datasets, h = humChart.data.datasets;
  t[7].data = pick("temp");
  h[3].data = pick("hum");
  t[7].hidden = h[3].hidden = !has;
  t[2].label = has ? "SHT31" : "温度";
  h[0].label = has ? "SHT31" : "湿度";
}

// web/app.py の api/data からデータを読み、現在値とグラフを更新する（1分ごと・日付を変えたとき）
async function load() {
  let res;
  try {
    res = await fetch(`api/data?day=${day}`, { cache: "no-store" });
  } catch (e) {
    $("updated").textContent = "接続できません（再試行中）";
    return;
  }
  const d = await res.json();

  // 上の3つのカードと最終記録の時刻を書き換える（5分以上記録がなければ注意を出す）
  // 設置場所の名前を見出しの横とブラウザのタブに出す（登録されていなければ出さない）
  $("place").textContent = d.location || "";
  document.title = d.location ? `温湿度モニター｜${d.location}` : "温湿度モニター";

  if (d.latest) {
    $("temp").innerHTML = `${d.latest.temp.toFixed(1)}<small>℃</small>`;
    $("hum").innerHTML = `${d.latest.hum.toFixed(1)}<small>%</small>`;
    $("status").textContent = d.latest.status;
    $("status").className = "value " + d.latest.status;
    // 湿度の状態（高湿注意・高湿警報）を、湿度の数字の下に出す。正常なら出さない
    const hs = d.latest.hum_status;
    $("humStatus").hidden = !hs || hs === "正常";
    $("humStatus").textContent = hs || "";
    $("humStatus").className = "substatus " + (hs || "");
    $("stale").hidden = !d.latest.stale;
    $("updated").textContent = `最終記録 ${d.latest.time}`;
  }
  showCompare(d.latest, d.thdrc);   // THD-R-C を動かしていなければ隠れる
  const CMP_POINTS = d.thdrc_points;   // 比較用センサー THD-R-C の10分ごとの平均

  // データを 0:00〜23:50 の軸に並べる（記録がない時間は null = 空白）
  const byTime = Object.fromEntries(d.points.map((p) => [p.time, p]));
  const pick = (k) => slots.map((s) => (byTime[s] ? byTime[s][k] : null));
  const ds = tempChart.data.datasets;
  ds[0].data = pick("temp_max");
  ds[1].data = pick("temp_min");
  ds[2].data = pick("temp");
  // 基準の線（古いデータで thresholds がないときは、前の版の high / low を警報の線として使う）
  const th = d.thresholds || { high_alarm: d.high, low_alarm: d.low };
  ["high_alarm", "high_warn", "low_warn", "low_alarm"].forEach((k, i) => {
    ds[3 + i].data = slots.map(() => th[k] ?? null);
  });
  humChart.data.datasets[0].data = pick("hum");
  humChart.data.datasets[1].data = slots.map(() => th.hum_alarm ?? null);
  humChart.data.datasets[2].data = slots.map(() => th.hum_warn ?? null);
  // 湿度の警報を使わない設定のときは、凡例にも出さない
  humChart.data.datasets[1].hidden = humChart.data.datasets[2].hidden = th.hum_alarm == null;
  showCompareLines(CMP_POINTS);
  tempChart.update();
  humChart.update();

  // 記録がない日は「この日の記録はありません」を出す
  $("empty").hidden = d.points.length > 0;
  $("day").value = day;
  $("dl").href = `download?day=${day}`;
}

// ============================================================
// グラフの拡大
// ============================================================

// 片方のグラフを拡大・移動したら、もう片方も同じ範囲にする
function syncRange(src) {
  const { min, max } = src.scales.x;
  for (const c of [tempChart, humChart]) if (c !== src) c.zoomScale("x", { min, max }, "none");
}

// ボタン: 最後の記録を右端にして、h 時間分を表示する（24 なら全体に戻す）
function showHours(h) {
  if (h >= 24) {
    tempChart.resetZoom("none");
    humChart.resetZoom("none");
    return;
  }
  const temps = tempChart.data.datasets[2].data;
  let last = temps.length - 1;
  while (last > 0 && temps[last] == null) last--;      // 最後の記録の位置
  const n = h * 6;                                     // h 時間 = 6 × h マス
  const max = Math.max(last, n);
  for (const c of [tempChart, humChart]) c.zoomScale("x", { min: max - n, max }, "none");
}
// ボタン: 表示している範囲を、幅の半分だけ前（dir = -1）か次（dir = 1）へ動かす
function moveRange(dir) {
  const { min, max } = tempChart.scales.x;
  const width = max - min;
  const step = Math.max(1, Math.round(width / 2));
  const newMin = Math.min(Math.max(min + dir * step, 0), slots.length - 1 - width);
  for (const c of [tempChart, humChart]) c.zoomScale("x", { min: newMin, max: newMin + width }, "none");
}
document.querySelectorAll(".zoombar button").forEach((b) => {
  b.onclick = () => b.dataset.move ? moveRange(Number(b.dataset.move)) : showHours(Number(b.dataset.hours));
});
$("zoomHint").textContent = isTouch
  ? "2本指で拡大・1本指で左右に移動"
  : "ドラッグで範囲を選んで拡大・Shift＋ドラッグで移動・Ctrl＋ホイールで拡大縮小";

// 表示する日を n 日ずらす（前日 = -1、翌日 = +1）。日を変えたら拡大は元に戻す
function shift(n) {
  const t = new Date(day + "T00:00:00");
  t.setDate(t.getDate() + n);
  day = fmt(t);
  showHours(24);
  load();
}

// ボタンを押したときの動き
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);
$("today").onclick = () => { day = fmt(new Date()); showHours(24); load(); };
$("day").onchange = (e) => { if (e.target.value) { day = e.target.value; showHours(24); load(); } };

// ---- ページを開いたときに始まる処理 ----
buildCharts();
load();
setInterval(load, 60 * 1000);   // 1分ごとに自動更新
</script>
</body>
</html>
