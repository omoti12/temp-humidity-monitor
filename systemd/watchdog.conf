# ============================================================
# ウォッチドッグ（ラズパイが固まったら自動で再起動する）の設定
#   ラズパイに付いている見張り役の部品（ハードウェアウォッチドッグ）を、systemd が定期的に「生きてるよ」と
#   つつき続ける。ラズパイ全体が固まってつつけなくなると、15秒後に見張り役が自動で再起動する。
#
# 置き場所 : /etc/systemd/system.conf.d/watchdog.conf
# 反映     : sudo systemctl daemon-reexec
# 確認     : systemctl show -p RuntimeWatchdogUSec   （15s と出れば有効）
# ============================================================
[Manager]
# 固まってから再起動するまでの時間（ラズパイの見張り役は最大15秒まで）
RuntimeWatchdogSec=15
# 再起動の途中で固まったときも、2分たったら強制的に再起動する
RebootWatchdogSec=2min
