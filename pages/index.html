<!doctype html>
<!--
  ============================================================
  公開サイトの画面（https://omoti12.github.io/temp-humidity-monitor/）

  データの読み先
    ・現在値：ラズパイの窓口（NOW_URL）を5秒ごとに読む
              つながらないときは data/latest.json（10分ごとに更新）の値を表示する
    ・グラフ：data/日付.json（ラズパイが10分ごとに送る）を1分ごとに読み直す

  このファイルを直したら、ラズパイで git pull すると、次の公開（10分以内）で反映される
  （すぐ反映したいときは python3 ~/temp-monitor/pages/publish.py）
  ============================================================
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- スマホでも見やすい幅で表示する -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>温湿度モニター</title>
<!-- グラフを描く部品（Chart.js）。サイトと一緒に置いてある -->
<script src="chart.umd.js"></script>
<style>
  /* ---- 色の設定（ここを変えると全体の色が変わる）---- */
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --temp: #d9480f; --hum: #1c7ed6; --ok: #2b8a3e; --warn: #e8590c; --out: #7048e8;
    --hot-warn: #b08800; --cold-warn: #9775fa;
  }
  /* スマホやPCがダークモードのときの色 */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --card: #1d2027; --text: #e9ecef; --muted: #9aa1ab; --line: #2c313a;
      --temp: #ff8a5c; --hum: #66b2ff; --ok: #51cf66; --warn: #ff922b; --out: #b197fc;
      --hot-warn: #fcc419; --cold-warn: #d0bfff;
    }
  }
  /* ---- 全体のレイアウト ---- */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans CJK JP", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 1.3rem; margin: 0; }
  .updated { color: var(--muted); font-size: .85rem; }
  /* ---- 上の3つのカード（現在の温度・湿度・状態）---- */
  .now { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .label { color: var(--muted); font-size: .85rem; }
  .value { font-size: 2.4rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .value small { font-size: 1rem; font-weight: 400; margin-left: 2px; }
  #temp { color: var(--temp); } #hum { color: var(--hum); }
  /* 状態の文字の色（正常=緑、高温注意=黄、高温警報=オレンジ、低温注意=薄紫、低温警報=紫） */
  /* 「高温」「低温」は前の版で記録した状態の名前（警報と同じ色にする） */
  #status.正常 { color: var(--ok); }
  #status.高温注意 { color: var(--hot-warn); } #status.高温警報, #status.高温 { color: var(--warn); }
  #status.低温注意 { color: var(--cold-warn); } #status.低温警報, #status.低温 { color: var(--out); }
  .stale { color: var(--warn); font-size: .85rem; margin-top: 4px; }
  /* ---- 日付を選ぶボタンの並び ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .controls button, .controls input, .controls a {
    font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); text-decoration: none; cursor: pointer; }
  /* ---- グラフ ---- */
  .chart-card { margin-bottom: 12px; }
  .chart-box { position: relative; height: 260px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  /* ---- 警報メールの宛先（管理）---- */
  .admin { margin-top: 24px; }
  .admin summary { cursor: pointer; font-weight: 600; }
  .admin .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .admin input { flex: 1 1 220px; min-width: 0; font: inherit; padding: 6px 10px; border-radius: 8px;
                 border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .admin button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
                  background: var(--card); color: var(--text); cursor: pointer; }
  .admin ul { list-style: none; padding: 0; margin: 12px 0 0; }
  .admin li { display: flex; justify-content: space-between; align-items: center; gap: 8px;
              padding: 8px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .admin .msg { font-size: .9rem; margin: 10px 0 0; min-height: 1.2em; }
  .admin .msg.error { color: var(--warn); }
  .admin .sub { font-size: 1rem; margin: 20px 0 4px; }
  .admin .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 16px; margin-top: 8px; }
  .admin .grid label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  .admin .grid input { flex: none; width: 100%; color: var(--text); }
  .admin .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: .9rem; }
  .admin .check input { flex: none; width: auto; }
  /* ---- スマホなど画面が狭いとき（幅600px以下）---- */
  @media (max-width: 600px) {
    .now { grid-template-columns: 1fr 1fr; }
    .now .card:last-child { grid-column: span 2; }
    .value { font-size: 1.9rem; }
    .chart-box { height: 220px; }
  }
</style>
</head>
<body>
<main>
  <!-- 見出しと最終測定の時刻 -->
  <header>
    <h1>温湿度モニター</h1>
    <span class="updated" id="updated"></span>
  </header>

  <!-- 現在の温度・湿度・状態（中身は下の showLatest() が書き込む） -->
  <section class="now">
    <div class="card"><div class="label">現在の温度</div><div class="value" id="temp">--</div></div>
    <div class="card"><div class="label">現在の湿度</div><div class="value" id="hum">--</div></div>
    <div class="card"><div class="label">状態</div><div class="value" id="status">--</div>
      <div class="stale" id="stale" hidden>30分以上データが更新されていません</div></div>
  </section>

  <!-- 表示する日を切り替えるボタンと、CSVのダウンロード -->
  <div class="controls">
    <button id="prev">◀ 前日</button>
    <input type="date" id="day">
    <button id="next">翌日 ▶</button>
    <button id="today">今日</button>
    <a id="dl" href="#">CSVダウンロード</a>
  </div>

  <!-- グラフを描く場所 -->
  <div class="card chart-card">
    <div class="label">温度（10分ごとの平均、薄い帯は最高〜最低）</div>
    <div class="chart-box"><canvas id="tempChart"></canvas></div>
  </div>
  <div class="card chart-card">
    <div class="label">湿度（10分ごとの平均）</div>
    <div class="chart-box"><canvas id="humChart"></canvas></div>
  </div>
  <div class="empty" id="empty" hidden>この日の記録はありません</div>

  <!-- 管理（警報の設定・警報メールの宛先）。押すと開く。管理用パスワードが必要 -->
  <details class="card admin">
    <summary>管理（警報の設定・メールの宛先）</summary>
    <div class="label" style="margin-top:8px">表示・変更には管理用パスワードが必要です</div>
    <form class="row" id="pwForm">
      <input type="password" id="pw" placeholder="管理用パスワード" autocomplete="current-password">
      <button type="submit">表示</button>
    </form>

    <!-- 警報の設定（パスワードが正しいと表示される） -->
    <form id="settingsForm" hidden>
      <h3 class="sub">警報の設定</h3>
      <div class="grid">
        <label>高温警報（℃以上）<input type="number" step="0.1" id="s_high_alarm" required></label>
        <label>高温注意（℃以上）<input type="number" step="0.1" id="s_high_warn" required></label>
        <label>低温注意（℃以下）<input type="number" step="0.1" id="s_low_warn" required></label>
        <label>低温警報（℃以下）<input type="number" step="0.1" id="s_low_alarm" required></label>
        <label>回復の幅（℃）<input type="number" step="0.1" min="0" max="5" id="s_hysteresis" required></label>
        <label>再通知の間隔（分。0で再通知しない）<input type="number" step="1" min="0" max="1440" id="s_remind_min" required></label>
      </div>
      <label class="check"><input type="checkbox" id="s_mail_on_warn">「注意」でもメールを送る（オフなら「警報」だけ送る）</label>
      <div class="row"><button type="submit">設定を保存</button></div>
      <p class="msg" id="settingsMsg"></p>
    </form>

    <!-- 警報メールの宛先（パスワードが正しいと表示される） -->
    <h3 class="sub" id="rcptsTitle" hidden>警報メールの宛先</h3>
    <ul id="rcpts"></ul>
    <form class="row" id="addForm" hidden>
      <input type="email" id="newEmail" placeholder="追加するメールアドレス" autocomplete="off">
      <button type="submit">追加</button>
    </form>
    <p class="msg" id="adminMsg"></p>
  </details>
</main>

<script>
// ============================================================
// 画面を動かすプログラム（JavaScript）
// ============================================================

// よく使う短縮の関数
// $("temp")      … id="temp" の部品を取り出す
// css("--temp")  … 上の :root で決めた色を取り出す
// fmt(日付)      … 日付を "2026-10-19" の形にする
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (d) => d.toLocaleDateString("sv-SE");   // YYYY-MM-DD
// 今表示している日（最初は今日）
let day = fmt(new Date());
let tempChart, humChart;

// 0:00〜23:50 の10分刻みの軸（記録がない時間は空白にする）
const slots = [];
for (let m = 0; m < 24 * 60; m += 10)
  slots.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));

// 横軸の目盛り: 狭い画面は6時間ごと、広い画面は2時間ごと
const tickEvery = () => (window.innerWidth < 600 ? 36 : 12);

// グラフ共通の見た目の設定（unit は "℃" か "%"）
function lineOpts(unit) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false, spanGaps: false,
    // グラフにマウスを乗せると、その時刻の値をまとめて表示する
    interaction: { mode: "index", intersect: false },
    // 名前が "_" で始まるデータ（最高・最低の帯）は、凡例と吹き出しに出さない
    plugins: { legend: { labels: { color: css("--muted"), filter: (i) => !i.text.startsWith("_") } },
               tooltip: { filter: (i) => !i.dataset.label.startsWith("_"),
                          callbacks: { label: (c) => `${c.dataset.label}: ${c.parsed.y}${unit}` } } },
    scales: {
      x: { ticks: { color: css("--muted"), maxRotation: 0, autoSkip: false,
                    callback: (v, i) => i % tickEvery() === 0 ? slots[i] : "" },
           grid: { color: (c) => c.index % tickEvery() === 0 ? css("--line") : "transparent" } },
      y: { ticks: { color: css("--muted"), callback: (v) => v + unit }, grid: { color: css("--line") } },
    },
  };
}

// グラフを2つ作る（最初は空。データは load() で入れる）
function buildCharts() {
  const temp = css("--temp"), hum = css("--hum");
  tempChart = new Chart($("tempChart"), {
    type: "line",
    data: { labels: slots, datasets: [
      // [0] 最高 と [1] 最低：この2本の間を薄く塗って「帯」にする
      { label: "_max", data: [], borderWidth: 0, pointRadius: 0, fill: "+1", backgroundColor: temp + "22" },
      { label: "_min", data: [], borderWidth: 0, pointRadius: 0, fill: false },
      // [2] 温度の平均
      { label: "温度", data: [], borderColor: temp, backgroundColor: temp, pointRadius: 2, borderWidth: 2 },
      // [3]〜[6] 警報（破線）と注意（点線）の基準
      { label: "高温警報", data: [], borderColor: css("--warn"), borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5 },
      { label: "高温注意", data: [], borderColor: css("--hot-warn"), borderDash: [2, 3], pointRadius: 0, borderWidth: 1.5 },
      { label: "低温注意", data: [], borderColor: css("--cold-warn"), borderDash: [2, 3], pointRadius: 0, borderWidth: 1.5 },
      { label: "低温警報", data: [], borderColor: css("--out"), borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5 },
    ] },
    options: lineOpts("℃"),
  });
  humChart = new Chart($("humChart"), {
    type: "line",
    data: { labels: slots, datasets: [
      { label: "湿度", data: [], borderColor: hum, backgroundColor: hum, pointRadius: 2, borderWidth: 2 },
    ] },
    options: lineOpts("%"),
  });
}

// ラズパイが10分ごとに data/ 以下のJSONを更新する。キャッシュを避けるため時刻を付けて読む
async function getJson(path) {
  const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
  return res.ok ? res.json() : null;
}

// ラズパイの現在値の窓口（Tailscale Funnel のURL + /api/now）。空なら10分ごとのデータだけで表示する
const NOW_URL = "https://raspberrypi.tailfa1dcc.ts.net/api/now";
let live = false;   // ラズパイから直接現在値を読めているか

// 上の3つのカードと最終測定の時刻を書き換える
// isLive が true ならラズパイから直接読んだ値、false なら10分ごとのデータの値
function showLatest(l, isLive) {
  const ts = new Date(l.time);
  $("temp").innerHTML = `${l.temp.toFixed(1)}<small>℃</small>`;
  $("hum").innerHTML = `${l.hum.toFixed(1)}<small>%</small>`;
  $("status").textContent = l.status;
  $("status").className = "value " + l.status;
  // 測定時刻が古すぎるとき（リアルタイムなら5分、10分ごとのデータなら30分）は注意を出す
  $("stale").hidden = Date.now() - ts < (isLive ? 5 : 30) * 60 * 1000;
  $("stale").textContent = `${isLive ? 5 : 30}分以上データが更新されていません`;
  $("updated").textContent = `最終測定 ${fmt(ts)} ${ts.toTimeString().slice(0, isLive ? 8 : 5)}`
    + (isLive ? "（リアルタイム）" : "（10分ごとに更新）");
}

// ラズパイの窓口から現在値を読む（5秒ごと）
async function loadNow() {
  if (!NOW_URL) return;
  try {
    const res = await fetch(NOW_URL, { cache: "no-store" });
    const n = res.ok ? await res.json() : null;
    live = !!(n && n.latest);
    if (live) showLatest({ ...n.latest, time: n.latest.iso }, true);
  } catch (e) {
    live = false;   // ラズパイにつながらないときは10分ごとのデータを表示する
  }
}

// 10分ごとのデータを読んで、グラフを描き直す（1分ごと・日付を変えたとき）
async function load() {
  let info, dayData;
  try {
    // latest.json（最新値など）と、表示している日のデータを同時に読む
    [info, dayData] = await Promise.all([getJson("data/latest.json"), getJson(`data/${day}.json`)]);
  } catch (e) {
    $("updated").textContent = "接続できません（再試行中）";
    return;
  }
  if (!info) return;
  const d = { ...info, points: dayData ? dayData.points : [] };

  // ラズパイから直接読めていないときだけ、こちらの値を現在値として表示する
  if (d.latest && !live) showLatest(d.latest, false);

  // データを 0:00〜23:50 の軸に並べる（記録がない時間は null = 空白）
  const byTime = Object.fromEntries(d.points.map((p) => [p.time, p]));
  const pick = (k) => slots.map((s) => (byTime[s] ? byTime[s][k] : null));
  const ds = tempChart.data.datasets;
  ds[0].data = pick("temp_max");
  ds[1].data = pick("temp_min");
  ds[2].data = pick("temp");
  // 基準の線（古いデータで thresholds がないときは、前の版の high / low を警報の線として使う）
  const th = d.thresholds || { high_alarm: d.high, low_alarm: d.low };
  ["high_alarm", "high_warn", "low_warn", "low_alarm"].forEach((k, i) => {
    ds[3 + i].data = slots.map(() => th[k] ?? null);
  });
  humChart.data.datasets[0].data = pick("hum");
  tempChart.update();
  humChart.update();

  // 記録がない日は「この日の記録はありません」を出し、CSVのリンクを隠す
  $("empty").hidden = d.points.length > 0;
  $("day").value = day;
  $("dl").href = `data/${day}.csv`;
  $("dl").hidden = !dayData;
}

// 表示する日を n 日ずらす（前日 = -1、翌日 = +1）
function shift(n) {
  const t = new Date(day + "T00:00:00");
  t.setDate(t.getDate() + n);
  day = fmt(t);
  load();
}

// ボタンを押したときの動き
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);
$("today").onclick = () => { day = fmt(new Date()); load(); };
$("day").onchange = (e) => { if (e.target.value) { day = e.target.value; load(); } };

// ============================================================
// 管理（警報の設定・警報メールの宛先）
//   ラズパイの窓口 /api/settings・/api/recipients に、管理用パスワードを付けて頼む
//   パスワードはこのページを開いている間だけ覚えておく（保存はしない）
// ============================================================
const ADMIN_URL = NOW_URL ? NOW_URL.replace(/\/api\/now$/, "/api/recipients") : "";
const SETTINGS_URL = NOW_URL ? NOW_URL.replace(/\/api\/now$/, "/api/settings") : "";
let adminPw = "";
// 警報の設定の項目（画面の入力欄の id は "s_" + 名前）
const SETTING_KEYS = ["high_alarm", "high_warn", "low_warn", "low_alarm", "hysteresis", "remind_min"];

// メッセージを表示する（isError が true なら注意の色）
function adminMsg(text, isError) {
  $("adminMsg").textContent = text;
  $("adminMsg").className = "msg" + (isError ? " error" : "");
}

// ラズパイの窓口を呼ぶ。method は "GET"（表示）"POST"（追加）"PUT"（変更）"DELETE"（削除）
// data は送る内容、url は窓口（省略すると宛先の窓口）
async function adminCall(method, data, url = ADMIN_URL) {
  if (!url) throw new Error("ラズパイの窓口が設定されていません");
  let res;
  try {
    res = await fetch(url, {
      method, cache: "no-store",
      headers: { "Authorization": `Bearer ${adminPw}`, "Content-Type": "application/json" },
      body: data ? JSON.stringify(data) : undefined,
    });
  } catch (e) {
    throw new Error("ラズパイにつながりません。電源とネットを確認してください");
  }
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(d.error || `エラーが起きました（${res.status}）`);
  return d;
}

// 宛先の一覧を表示する（アドレスは textContent で入れ、文字をそのまま表示する）
function renderRecipients(list) {
  const ul = $("rcpts");
  ul.replaceChildren();
  for (const email of list) {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = email;
    const btn = document.createElement("button");
    btn.textContent = "削除";
    btn.onclick = async () => {
      if (!confirm(`${email} を宛先から削除しますか？`)) return;
      try {
        renderRecipients((await adminCall("DELETE", { email })).recipients);
        adminMsg(`${email} を削除しました`);
      } catch (e) { adminMsg(e.message, true); }
    };
    li.append(span, btn);
    ul.append(li);
  }
  $("addForm").hidden = false;
  $("rcptsTitle").hidden = false;
}

// 警報の設定を入力欄に入れる
function renderSettings(st) {
  for (const k of SETTING_KEYS) $("s_" + k).value = st[k];
  $("s_mail_on_warn").checked = !!st.mail_on_warn;
  $("settingsForm").hidden = false;
}

// 設定のメッセージを表示する（isError が true なら注意の色）
function settingsMsg(text, isError) {
  $("settingsMsg").textContent = text;
  $("settingsMsg").className = "msg" + (isError ? " error" : "");
}

// 「表示」: パスワードを確かめて、警報の設定と宛先の一覧を出す
$("pwForm").onsubmit = async (e) => {
  e.preventDefault();
  adminPw = $("pw").value;
  adminMsg("確認中...");
  try {
    renderRecipients((await adminCall("GET")).recipients);
    renderSettings((await adminCall("GET", null, SETTINGS_URL)).settings);
    adminMsg("");
    settingsMsg("");
  } catch (err) {
    $("rcpts").replaceChildren();
    $("addForm").hidden = true;
    $("rcptsTitle").hidden = true;
    $("settingsForm").hidden = true;
    adminMsg(err.message, true);
  }
};

// 「設定を保存」: 入力した設定をラズパイに保存する
$("settingsForm").onsubmit = async (e) => {
  e.preventDefault();
  const data = { mail_on_warn: $("s_mail_on_warn").checked };
  for (const k of SETTING_KEYS) data[k] = Number($("s_" + k).value);
  settingsMsg("保存中...");
  try {
    renderSettings((await adminCall("PUT", data, SETTINGS_URL)).settings);
    settingsMsg("保存しました。警報の判定にはすぐ反映され、グラフの線は1〜2分で変わります");
    setTimeout(load, 90 * 1000);   // 公開サイトの更新を待ってからグラフを読み直す
  } catch (err) { settingsMsg(err.message, true); }
};

// 「追加」: 入力したアドレスを宛先に加える（追加したアドレスにはお知らせメールが届く）
$("addForm").onsubmit = async (e) => {
  e.preventDefault();
  const email = $("newEmail").value.trim();
  if (!email) return;
  adminMsg("追加中...");
  try {
    const d = await adminCall("POST", { email });
    renderRecipients(d.recipients);
    $("newEmail").value = "";
    adminMsg(d.notified ? `${email} を追加し、お知らせメールを送りました`
                        : `${email} を追加しました（お知らせメールは送れませんでした）`);
  } catch (err) { adminMsg(err.message, true); }
};

// ---- ページを開いたときに始まる処理 ----
buildCharts();
setInterval(load, 60 * 1000);   // グラフは1分ごとに読み直す
loadNow().then(load);
setInterval(loadNow, 5 * 1000);  // 現在値は5秒ごとに読み直す
</script>
</body>
</html>
