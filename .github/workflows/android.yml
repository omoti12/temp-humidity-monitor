# ============================================================
# Android アプリ（APK）を自動で作る設定（GitHub Actions）
#   android/ の中を直して main に送ると、GitHub が APK を作り、
#   「Releases」の「android-latest」に置く（スマホからダウンロードして入れる）
# ============================================================
name: Android アプリを作る

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:      # GitHub の画面から手動でも作れる

permissions:
  contents: write         # Releases に APK を置くため

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: APK を作る
        run: gradle -p android assembleDebug --no-daemon

      - name: Releases に置く（前の版は置き換える）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TempMonitor.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest TempMonitor.apk \
            --title "Android アプリ（最新版）" \
            --notes "温湿度モニターの Android アプリです。TempMonitor.apk をスマホでダウンロードして入れてください。見るには Tailscale が必要です。新しい版を入れるときは、古いアプリを消してから入れてください。（${{ github.sha }} から作成）"
